<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Practice</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  nav button { margin-right: .5rem; padding: .4rem 1rem; cursor: pointer; }
  nav button.active { font-weight: bold; }
  .q { border-bottom: 1px solid #ddd; padding: 1rem 0; }
  .q ul { list-style: none; padding-left: 0; }
  summary { cursor: pointer; color: #06c; }
  details > div { background: #f6f6f6; padding: .1rem .75rem; margin-top: .5rem; }
  pre { background: #f0f0f0; padding: .5rem; overflow-x: auto; }
  code { background: #f0f0f0; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: .2rem .5rem; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
  // Put MCQ files in data/ (OS_MCQ_Batch02.md -> OS section) and any notes in data/notes/.
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  const sections = {};

  // Returns the question blocks of one file: each starts with a "Q21." line (optionally a "## " heading).
  function questions(text) {
    return text.split(/^(?=#+ |Q\d+\.)/m)
      .filter(c => /^(#+\s*)?Q\d+\./.test(c))
      .map(c => c.slice(c.indexOf('\n') + 1).replace(/\s*(---\s*)+$/, '').trim());
  }

  function activate(name) {
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.textContent === name));
  }

  async function show(name) {
    activate(name);
    main.textContent = 'Loading...';
    const texts = await Promise.all(sections[name].map(f => fetch('data/' + f).then(r => r.text())));
    main.innerHTML = '';
    for (const block of texts.flatMap(questions)) {
      const i = block.search(/^\**Answer/m);
      const q = document.createElement('div');
      q.className = 'q';
      q.innerHTML = marked.parse(i < 0 ? block : block.slice(0, i));
      if (i >= 0) q.innerHTML += '<details><summary>Show answer</summary><div>' + marked.parse(block.slice(i)) + '</div></details>';
      main.append(q);
    }
  }

  // Notes: one collapsible per file in data/notes/; contents are fetched on first open.
  function showNotes(files) {
    activate('NOTES');
    main.innerHTML = '';
    for (const f of files) {
      const d = document.createElement('details');
      d.className = 'q';
      d.innerHTML = '<summary></summary><div></div>';
      d.querySelector('summary').textContent = f;
      d.ontoggle = async () => {
        const div = d.querySelector('div');
        if (!d.open || div.childNodes.length) return;
        const text = await (await fetch('data/notes/' + encodeURIComponent(f))).text();
        if (f.endsWith('.md')) div.innerHTML = marked.parse(text);
        else div.append(Object.assign(document.createElement('pre'), { textContent: text }));
      };
      main.append(d);
    }
  }

  function addTab(name, onclick) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = onclick;
    nav.append(b);
  }

  // Lists files in a dir: on GitHub Pages (<user>.github.io/<repo>/) via the GitHub API, locally via python http.server's listing.
  async function listFiles(dir) {
    if (location.hostname.endsWith('.github.io')) {
      const user = location.hostname.split('.')[0], repo = location.pathname.split('/')[1];
      const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${dir}`);
      return r.ok ? (await r.json()).filter(i => i.type === 'file').map(i => i.name) : [];
    }
    const r = await fetch(dir + '/');
    if (!r.ok) return [];
    return [...new DOMParser().parseFromString(await r.text(), 'text/html').querySelectorAll('a')]
      .map(a => decodeURIComponent(a.getAttribute('href')))
      .filter(f => !f.endsWith('/'));
  }

  const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true });

  Promise.all([listFiles('data'), listFiles('data/notes')]).then(([names, notes]) => {
    const files = names.filter(f => /\.(md|txt)$/.test(f)).sort(byName);
    // Section = text before "_MCQ" (C_CPP_MCQ_... -> C_CPP), else before the first "_".
    for (const f of files) (sections[(f.match(/^(.+?)_MCQ/i)?.[1] ?? f.split(/[_.]/)[0]).toUpperCase()] ??= []).push(f);
    for (const name of Object.keys(sections)) addTab(name, () => show(name));
    notes.sort(byName);
    if (notes.length) addTab('NOTES', () => showNotes(notes));
    const first = Object.keys(sections)[0];
    if (first) show(first); else main.textContent = 'No files in data/.';
  });
</script>
</body>
</html>
